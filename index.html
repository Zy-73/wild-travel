T$ '+Math.round(n).toLocaleString('zh-TW'):'待確認';app.innerHTML=`<section class="panel"><span class="tag">四人已完成</span><h2>花蓮｜共同推薦結果</h2><p class="small">根據四人共同接受的條件初步配對。以下是行程候選，不是已確認預訂的完整報價。</p><h3>① 出發方式比較</h3>${q2.map((n,i)=>`<div class="choice"><div class="stat"><strong>${['A｜11/5 住依瑾家，11/6 早上出發','B｜11/6 清晨車站集合','C｜11/5 下午先到花蓮，多住一晚'][i]}</strong><span>${n}/4 人</span></div><div class="bar"><div style="width:${n*25}%"></div></div><p class="small">${i===2?'需另外計算一晚花蓮住宿、可能增加的餐飲費':'花蓮住宿維持兩晚'}；實際車次與費用待確認</p></div>`).join('')}<p class="warn">Q2 是偏好統計，不會自動決定出發方案；須由四人再共同確認。</p><h3>② 四人共同條件</h3><p><strong>交通：</strong>${esc(transportLabel)}</p><p><strong>預算：</strong>${Number.isFinite(cap)?'共同預算保守篩選上限 '+money(cap):'至少一人選擇 10,000 元以上，仍需確認精確上限'}</p><p><strong>住宿：</strong>${room.length?room.map(i=>qs[6].opts[i]).join('、'):'住宿配置沒有共同選項，需協調'}</p><p><strong>活動限制：</strong>${[height?'有人恐高':null,water?'有人怕水':null,avoidHard?'有人只接受低強度活動':null].filter(Boolean).join('；')||'目前沒有標記恐高、怕水或高強度限制'}</p><h3>③ 共同活動偏好</h3>${interests.map(x=>`<div class="stat"><span class="small">${esc(x.name)}</span><span class="small">${x.n}/4</span></div><div class="bar"><div style="width:${x.n*25}%"></div></div>`).join('')}<h3>④ 行程候選</h3><div class="notice">活動以四人偏好與限制篩選；尚未依實際日期、場次、路線及天候完成排程，請勿直接視為已確認的每日行程。</div>${primary.map(a=>`<div class="choice"><div class="stat"><strong>${esc(a.name)}</strong><span class="pill">${money(a.price)}/人</span></div><p class="small">${a.duration} · ${a.source} · 共同興趣 ${a.score}/4</p><a href="${esc(a.link)}" target="_blank" rel="noopener noreferrer">查看原始網站 ↗</a></div>`).join('')}<h3>⑤ 三天兩夜具體行程（初排）</h3><p class="small">以下依活動類型與地理區域安排，日期採 11/6～11/8；出發方案 C 另加 11/5 住宿。時段為建議順序，未確認車次、營業及預約場次。</p>${(()=>{const names=primary.map(a=>a.name);const find=(keyword)=>primary.find(a=>a.name.includes(keyword));const blocks=[{date:'11/6（五）｜抵達與市區海岸',items:['搭乘火車抵達花蓮，領取當地交通工具（依共同交通選項）',...(find('賞鯨')?['依實際可預約場次：鯨世界賞鯨']:[]),'七星潭海岸風景區（自由散步、拍照）','入住住宿、晚餐自由安排']},{date:'11/7（六）｜主要體驗活動',items:[...(find('野猴子')?[find('野猴子').name]:[]),...(find('溯溪')?[find('溯溪').name]:[]),...(find('沙灘車')?[find('沙灘車').name]:[]),...(find('雲山水')?['雲山水夢幻湖（若時間允許）']:[]),'晚餐與休息']},{date:'11/8（日）｜輕鬆景點與返程',items:[...(find('理想 PAARK')?['理想 PAARK 水岸生活、7-ELEVEN 花蓮理想門市']:[]),...(find('臺灣原住民族文化館')?['臺灣原住民族文化館（確認當日開放）']:[]),'預留用餐、還車與車站報到時間','搭乘火車返回'] }];const scheduled=blocks.flatMap(b=>b.items.join('、'));const extra=primary.filter(a=>!scheduled.some(t=>t.includes(a.name)||a.name.includes('理想 PAARK')&&t.includes('理想 PAARK')));if(extra.length)blocks[1].items.push('其他已選活動（需確認時間能否排入）：'+extra.map(a=>a.name).join('、'));return blocks.map(b=>`<div class="choice"><strong>${b.date}</strong><ul>${b.items.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>`).join('')})()}<p class="warn">如四人無共同交通、住宿或活動安全條件，以上僅是待協調草案，不能視為已可執行的完整行程。部分活動可能跨區且耗時，正式排程需確認距離與預約時段。</p><h3>⑥ 住宿候選</h3>${stay?`<div class="choice"><strong>${stay.name}</strong><p>${stay.note}</p><p>兩晚四人平均約 <strong>${money(stayCost)}/人</strong>（僅指定日期價格尚待查證）</p><a href="${stay.link}" target="_blank" rel="noopener noreferrer">住宿網站 ↗</a></div>`:'<p class="warn">目前沒有可直接套用的共同住宿配置，住宿費暫不估算。</p>'}<h3>⑦ 預算初算</h3><p class="notice">官方公開價核對日：2026/10/14。住宿優先官網標價、無資料則簡報暫估；租車參考簡報截圖；機車依每台每日 300 元假設；火車票依單程每人 NT$583 計算；餐飲未核價。</p><div class="choice"><div class="stat"><span>已核實活動費小計（未核價項目不含）</span><strong>${money(activityCost)}/人</strong></div><div class="stat"><span>住宿兩晚（如適用）</span><strong>${stayCost==null?'待協調':money(stayCost)+'/人'}</strong></div><hr><div class="stat"><strong>已知項目小計</strong><span class="price">${base==null?'尚無完整小計':money(base)+'/人'}</span></div><p class="warn">${travelUnknown}，因此小計不等於旅行總預算，也不能據此判斷是否符合 ${money(cap)} 上限。</p></div><h3>⑧ 旅行社私人小團</h3><div class="notice">只接受四人獨立成團、不得與陌生旅客併團；每人完整費用必須不超過 NT$5,000。目前尚無完成指定日期、成團人數、總價查證的旅行社產品，因此不列入合格推薦。</div>${detailedCosts(primary,stay,nights,common.length?common:[2])}<p class="notice">若四人最後決定 Q2 的 C 方案（11/5 下午先抵達），下方為住宿增加一晚的費用版本：</p>${detailedCosts(primary,stay,3,common.length?common:[2])}<div class="actions"><button class="btn" id="back">返回首頁</button><button class="btn primary" id="vote">進入花蓮方案意見投票</button></div></section>`;document.getElementById('back').onclick=home;document.getElementById('vote').onclick=votePage}
function votePage(){app.innerHTML=`<section class="panel"><h2>花蓮方案意見投票</h2><p>四位朋友可以先表達對花蓮這個目的地的意願。等其他三個地區完成後，再進行四地最終投票。</p>${people.map(p=>`<div class="choice"><div class="stat"><strong>${p.animal} ${p.label}（${p.name}）</strong><span class="small">${state.votes?.[p.id]!=null?['想去花蓮','還想比較','不想去花蓮'][state.votes[p.id]]:'尚未投票'}</span></div><div class="actions">${['想去花蓮','還想比較','不想去花蓮'].map((s,i)=>`<button class="btn ${state.votes?.[p.id]===i?'primary':''}" data-vote="${p.id}:${i}">${s}</button>`).join('')}</div></div>`).join('')}<p class="small">已投票 ${voted()} / 4。此處是花蓮意願調查，並非四個地區的最終決選。</p><button class="btn" id="back">返回推薦結果</button></section>`;document.querySelectorAll('[data-vote]').forEach(b=>b.onclick=()=>{let [id,i]=b.dataset.vote.split(':');state.votes=state.votes||{};state.votes[id]=+i;save();votePage()});document.getElementById('back').onclick=results}
home();
</script></body></html>
